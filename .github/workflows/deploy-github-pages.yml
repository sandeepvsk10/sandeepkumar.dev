# Deploy the Vite build (`bun run build` → `dist/`) to GitHub Pages.
#
# REQUIRED ONE-TIME SETUP (or deploy fails with "Failed to create deployment (status: 404)"):
# 1. Repo → Settings → Pages
# 2. Under "Build and deployment", set Source to "GitHub Actions"
#    (NOT "Deploy from a branch" unless you switch workflows intentionally).
# 3. Push to `main` or run this workflow manually from Actions tab.
#
# After first deploy, approve the `github-pages` environment if GitHub prompts.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Compute base path for project Pages sites
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
            echo "Deploying user/org site at repo root (no base path)."
          else
            echo "VITE_BASE_PATH=/${REPO_NAME}/" >> "$GITHUB_ENV"
            echo "Deploying project site with base path /${REPO_NAME}"
          fi

      - name: Lint and build
        run: |
          bun run lint
          bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
