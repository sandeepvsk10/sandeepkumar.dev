<!-- Artwork and animation by Wale-Durojaye Ayotomiwa (ayotomcs.me/claude-mascot). Adapted from GSAP frame timing to self-contained CSS. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -30 180 160" fill="none" shape-rendering="crispEdges" role="img" aria-label="Animated Claude mascot waving with confetti"><style>
.frame {opacity:0;animation:frame 1s step-end infinite;}
@keyframes frame {0% {opacity:1;} 12.5%,100% {opacity:0;}}
.confetti {opacity:0;animation:appear 0s forwards,fall 1s step-end infinite;}
.confetti-0 {animation-delay:.125s,.125s;--x:90px;--flip:1;}
.confetti-1 {animation-delay:.75s,.75s;--x:40px;--flip:-1;}
@keyframes appear {to {opacity:1;}}
@keyframes fall {
 0% {transform:translate(var(--x),-65px) scale(var(--flip),1);}
 12.5% {transform:translate(var(--x),-72px) scale(var(--flip),1);}
 25% {transform:translate(var(--x),-76px) scale(var(--flip),1);}
 37.5% {transform:translate(var(--x),-70px) scale(var(--flip),1);}
 50% {transform:translate(var(--x),-58px) scale(var(--flip),1);}
 62.5% {transform:translate(var(--x),-42px) scale(var(--flip),1);}
 75% {transform:translate(var(--x),-22px) scale(var(--flip),1);}
 87.5%,100% {transform:translate(var(--x),0) scale(var(--flip),1);}
}
@media (prefers-reduced-motion:reduce) {
 .frame,.confetti {animation:none;opacity:0;}
 .body-frame:first-of-type {opacity:1;}
}
