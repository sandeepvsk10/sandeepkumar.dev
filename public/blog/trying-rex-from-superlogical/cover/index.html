<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rex Blog Artifact — Zoom Loop</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../../../cursors/site-cursor.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="stage" aria-label="Rex window split animation">
    <div class="window">
      <div class="material material--initial" aria-hidden="true"></div>
      <div class="pane pane--left">
        <div class="material material--pane" aria-hidden="true"></div>
        <div class="logo-position"><img src="assets/rex-logo.png" alt="Rex" draggable="false"></div>
      </div>
      <div class="pane pane--right">
        <div class="material material--pane" aria-hidden="true"></div>
        <div class="subpane subpane--top">
          <div class="material material--subpane" aria-hidden="true"></div>
          <div class="logo-position"><img src="assets/rex-logo.png" alt="Rex" draggable="false"></div>
        </div>
        <div class="subpane subpane--bottom">
          <div class="material material--subpane" aria-hidden="true"></div>
          <div class="logo-position"><img src="assets/rex-logo.png" alt="Rex" draggable="false"></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
